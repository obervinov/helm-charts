# A Job with a sidecar: the chart's ConfigMap and Secret are mounted explicitly,
# in the main container only (volume-configs / volume-secrets in its volumeMounts).
# The pod template carries the same labels as any other pod of the chart, plus extraLabels.
---
applications:
  - name: migrate
    app:
      type: job
      extraLabels:
        tier: batch
      extraAnnotations:
        example.com/owner: platform
      job:
        backoffLimit: 1
        restartPolicy: OnFailure
      containers:
        - name: migrate
          image:
            repository: registry.example.com/my-app
            tag: "1.0.0"
          volumeMounts:
            - name: volume-configs
              mountPath: /etc/my-app
              readOnly: true
            - name: volume-secrets
              mountPath: /etc/my-app/secrets
              readOnly: true
        - name: log-shipper
          image:
            repository: registry.example.com/log-shipper
            tag: "1.0.0"
    configMap:
      files:
        - name: config.yaml
          data: |
            database: my-app
    secret:
      data: |
        password: change-me
