#
#     # Services. The first one defaults to the name <fullName>; every other one needs `name`.
#     # The selector defaults to the pods of this application;
#     # `selectApp: <application name>` selects another application of the release,
#     # `selector` is a raw label map. Service names must be unique in the release.
#     services:
#       - type: NodePort                   # ClusterIP, NodePort, LoadBalancer
#         externalTrafficPolicy: Cluster
#         externalIPs:
#           - 192.0.2.10
#         extraAnnotations:
#           checksum/values.yaml: "helm/values.yaml"
#         ports:
#           - name: http
#             port: 80
#             protocol: TCP
#             targetPort: 80
#             nodePort: 30080
#       - name: my-app-headless
#         type: ClusterIP
#         clusterIP: None
#         ports:
#           - name: http
#             port: 80
#             targetPort: 80
#             protocol: TCP
#       - name: my-app-worker
#         type: ClusterIP
#         selectApp: worker
#         ports:
#           - name: metrics
#             port: 9090
#             targetPort: 9090
#             protocol: TCP
#
#     # Standalone PVCs. Name <fullName>-<name>, or exactly `claimName` (adopt an existing claim: it needs
#     # helm ownership metadata or `helm upgrade --take-ownership`, and must keep `keep: true`).
#     # Every claim gets helm.sh/resource-policy: keep (survives helm uninstall) unless keep: false.
#     # Mount them through app.volumes (persistentVolumeClaim.claimName) + volumeMounts.
#     persistentVolumeClaims:
#       - name: data
#         claimName: my-app-data             # optional
#         size: 1Gi                          # required
#         storageClassName: standard
#         accessModes:                       # default [ReadWriteOnce]
#           - ReadWriteOnce
#         volumeMode: Filesystem
#         keep: true                         # default true
#         annotations: {}
#         labels: {}
#
#     ingress:
#       apiVersion: networking.k8s.io/v1
#       kind: Ingress
#       extraAnnotations:
#         checksum/values.yaml: "helm/values.yaml"
#       useTLS: true
#       fqdn: my-service.example.com
#       paths:
#         - path: /
#           pathType: Prefix
#           # If both `servicePort` and `servicePortName` are set, `servicePortName` takes precedence. Because of this, you can set only one of them.
#           servicePort: 80
#           servicePortName: http
#           # Any Service of this release (see services); default: the first Service of this application
#           serviceName: my-app-headless
#       ingressClassName: nginx

#     # Description of the ConfigMap
#     # The contents of the config can be set via
#     # `--set-file "applications[0].configMap.files[0].data"="config.json"`
#     # The pod gets the volume `volume-configs`; mount it with containers[].volumeMounts (name: volume-configs)
#     # `files[0].name` - the name of the file in the container
#     # `files[0].data` - the config body is set via the --set-file parameter
#     configMap:
#       files:
#         - name: "config.json"
#           data: '{"key": "value"}'   # usually set with --set-file

#     # Description of the Secret
#     # The pod gets the volume `volume-secrets`; mount it with containers[].volumeMounts (name: volume-secrets)
#     secret:
#       data: |
#         username: admin
#         password: admin

