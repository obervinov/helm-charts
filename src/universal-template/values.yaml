# universal-template 4.x values reference.
# Every key below is optional unless marked "required"; values.schema.json rejects unknown keys.
#
# An application is a logical group for one microservice:
# - app                     - the workload (Deployment, StatefulSet, Job, CronJob, or none)
# - services                - Services for the workload (or for another application of the release)
# - persistentVolumeClaims  - standalone PVCs
# - ingress, configMap, secret, rbac, monitoring
#
# Names: with one application every object is named <release>, with several <release>-<application name>
# (below: <fullName>). Pods carry the label `appselector: <fullName>`.
---
# Anchors with ports of your services can be installed here for reuse
# service_port_http: &service_port_http 80
# service_metrics_port: &service_metrics_port 9090

applications: []
