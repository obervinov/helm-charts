---
applications:
  - name: statefulset-app
    app:
      type: statefulset
      replicas: 1
      extraLabels:
        tier: statefulset-app
      extraAnnotations:
        checksum/values.yaml: helm/values.yaml
      networkPolicy:
        policyTypes:
          - Ingress
          - Egress
        ingress:
          - from:
              - podSelector:
                  matchLabels:
                    app: my-app
            ports:
              - protocol: TCP
                port: 80
        egress:
          - to:
              - podSelector:
                  matchLabels:
                    app: my-app
            ports:
              - protocol: TCP
                port: 80
      imagePullSecrets:
        - my-secret
      containers:
        - name: container1
          image:
            repository: my-registry/app1
            tag: 1.0.0
            pullPolicy: IfNotPresent
            commands:
              - bash
            args:
              - -c
              - env
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - echo Hello from the postStart handler > /usr/share/message
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - nginx -s quit; while killall -0 nginx; do sleep 1; done
          envs:
            - name: LOG_LEVEL
              value: INFO
            - name: SECRET_USERNAME
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: username
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: empty-data
              mountPath: /cache
            - name: data
              mountPath: /data
            - name: my-external-secret
              mountPath: /external-secrets
              readOnly: true
            - name: my-external-config
              mountPath: /external-configs
              readOnly: true
            - name: volume-configs
              mountPath: /configs
              readOnly: true
            - name: volume-secrets
              mountPath: /secrets
              readOnly: true
          probes:
            livenessProbe:
              httpGet:
                path: /health/liveness
                port: 80
              initialDelaySeconds: 30
              periodSeconds: 5
              timeoutSeconds: 5
              successThreshold: 1
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health/readiness
                port: 80
              initialDelaySeconds: 15
              periodSeconds: 5
              timeoutSeconds: 5
              successThreshold: 1
              failureThreshold: 3
            startupProbe:
              httpGet:
                path: /health/startup
                port: 80
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 1
              successThreshold: 1
              failureThreshold: 3
        - name: container2
          image:
            repository: my-registry/app2
            tag: 1.0.0
            pullPolicy: IfNotPresent
          envs:
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      initContainers:
        - name: init-container1
          image:
            repository: my-registry/init-container1
            tag: 1.0.0
            pullPolicy: IfNotPresent
          envs:
            - name: LOG_LEVEL
              value: INFO
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: init
        - name: init-container2
          image:
            repository: my-registry/init-container2
            tag: 1.0.0
            pullPolicy: IfNotPresent
          envs:
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/e2e-az-name
                    operator: In
                    values:
                      - e2e-az1
      nodeSelector:
        disktype: ssd
      tolerations:
        - key: key
          operator: Equal
          value: value
          effect: NoSchedule
      volumeClaimTemplates:
        - name: data
          size: 1Gi
          accessModes:
            - ReadWriteOnce
          storageClassName: standard
      volumes:
        - name: empty-data
          emptyDir:
            sizeLimit: 1Gi
        - name: my-external-secret
          secret:
            secretName: my-external-secret
        - name: my-external-config
          configMap:
            name: my-external-config
      updateStrategy:
        type: RollingUpdate
    services:
      - externalTrafficPolicy: Cluster
        externalIPs:
          - 1.1.1.1
        extraAnnotations:
          checksum/values.yaml: helm/values.yaml
        type: NodePort
        ports:
          - name: http
            port: 80
            protocol: TCP
            targetPort: 80
            nodePort: 30080
    ingress:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      extraAnnotations:
        checksum/values.yaml: helm/values.yaml
      useTLS: true
      fqdn: my-service.example.com
      paths:
        - path: /
          pathType: Prefix
          servicePort: 80
      ingressClassName: nginx
    configMap:
      files:
        - name: config.json
          data: |
            {
              "key": "value"
            }
    secret:
      data: |
        key1: "value1"
        key2: "value2"
    rbac:
      create: false
      useExistingServiceAccount: my-existing-service-account
      legacyToken: true
    monitoring:
      prometheus:
        - name: servicemonitor1
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          namespacesSelector:
            - monitoring
          endpoints:
            - port: http
              path: /metrics
              interval: 15s
              scheme: http
        - name: podmonitor1
          apiVersion: monitoring.coreos.com/v1
          kind: PodMonitor
          namespacesSelector:
            - monitoring
          endpoints:
            - port: http
              path: /metrics
              interval: 15s
              scheme: http
