{{- if .Values.applications                                                               }}
{{-   range .Values.applications                                                          }}
{{-     if .app                                                                           }}
{{-       if eq .app.type "statefulset"                                                   }}
{{-         $configMap          := .configMap                                             }}
{{-         $secret             := .secret                                                }}
{{-         $service            := .service                                               }}
{{-         $name               := .name                                                  }}
{{-         $app                := .app                                                   }}
{{-         $namespace          := $.Release.Namespace                                    }}
{{-         $fullName           := include "universal-template.fullName" (list $ . $name) }}
{{-         $extraLabels        := $app.extraLabels                                       }}
{{-         $extraAnnotations   := $app.extraAnnotations                                  }}
{{-         $replicas           := $app.replicas                                          }}
{{-         $initContainers     := $app.initContainers                                    }}
{{-         $containers         := $app.containers                                        }}
{{-         $imagePullSecrets   := $app.imagePullSecrets                                 }}
{{-         $tolerations        := $app.tolerations                                       }}
{{-         $affinity           := $app.affinity                                          }}
{{          $nodeSelector       := $app.nodeSelector                                      }}
{{          $rbac               := .rbac                                                  }}
{{-         $_ := include "universal-template.validate.pod" (dict "name" $name "app" $app "configMap" $configMap "secret" $secret) }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "universal-template.labels" $ | nindent 4 }}
    {{- include "universal-template.selectorLabels" (list $fullName )  | nindent 4 }}
    {{- if $extraLabels }}
    {{-   toYaml $extraLabels | nindent 4 }}
    {{- end }}
  {{- if $extraAnnotations }}
  annotations: {{- toYaml $extraAnnotations | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ default $fullName $app.serviceName }}
  replicas: {{ default 1 $replicas }}
  {{- with $app.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{- include "universal-template.selectorLabels" (list $fullName )  | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "universal-template.labels" $ | nindent 8 }}
        {{- include "universal-template.selectorLabels" (list $fullName )  | nindent 8 }}
        {{- if $extraLabels }}
        {{-   toYaml $extraLabels | nindent 8 }}
        {{- end }}
      {{- if $extraAnnotations }}
      annotations: {{- toYaml $extraAnnotations | nindent 8 }}
      {{- end }}
    spec:
      {{- if $rbac }}
      {{-   include "universal-template.serviceAccount" (list $fullName $rbac) | nindent 6 }}
      {{- end }}
      {{- if $imagePullSecrets }}
      imagePullSecrets:
      {{-   range $imagePullSecrets }}
        - name: {{ . }}
      {{-   end }}
      {{- end }}
      {{- if $initContainers }}
      initContainers:
      {{-   range $initContainers }}
      {{-     $initContainerData := dict "app" . "name" .name "configMap" $configMap "secret" $secret }}
      {{- include "universal-template.container.template" $initContainerData | nindent 8 }}
      {{-   end }}
      {{- end }}
      containers:
      {{- range $containers }}
      {{- $containerData := dict "app" . "name" .name "configMap" $configMap "secret" $secret }}
      {{- include "universal-template.container.template" $containerData | nindent 8 }}
      {{- end }}
      {{- if or $configMap $secret $app.volumes }}
      {{-   $volumesData := dict "targetType" "statefulset" "fullName" $fullName "configMap" $configMap "secret" $secret "volumes" $app.volumes }}
      volumes: {{-   include "universal-template.volumes.template" $volumesData | nindent 8 }}
      {{- end }}
      {{- if $tolerations }}
      tolerations: {{- toYaml $tolerations | nindent 8 }}
      {{- end }}
      {{- if $affinity }}
      affinity: {{- toYaml $affinity | nindent 8 }}
      {{- end }}
      {{- if $nodeSelector }}
      nodeSelector: {{- toYaml $nodeSelector | nindent 8 }}
      {{- end }}
  {{- if $app.volumeClaimTemplates }}
  volumeClaimTemplates:
  {{-   range $app.volumeClaimTemplates }}
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: {{ .name }}
        {{- with .annotations }}
        annotations: {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .labels }}
        labels: {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
        {{- if .accessModes }}
        {{-   range .accessModes }}
          - {{ . }}
        {{-   end }}
        {{- else }}
          - ReadWriteOnce
        {{- end }}
        resources:
          requests:
            storage: {{ .size }}
        storageClassName: {{ .storageClassName }}
        volumeMode: {{ default "Filesystem" .volumeMode }}
  {{-   end }}
  {{- end }}
...
{{-       end }}
{{-     end }}
{{-   end }}
{{- end }}