{{- range .Values.applications }}
{{-   if eq (dig "app" "type" "none" .) "statefulset" }}
{{-     $fullName := include "universal-template.fullName" (dict "root" $ "name" .name) }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullName | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  {{- include "universal-template.metadata" (dict "root" $ "fullName" $fullName "labels" .app.extraLabels) | nindent 2 }}
spec:
  serviceName: {{ .app.serviceName | default $fullName | quote }}
  replicas: {{ dig "replicas" 1 .app | toJson }}
  {{- with .app.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{- include "universal-template.selectorLabels" $fullName | nindent 6 }}
  template: {{- include "universal-template.podTemplate" (dict "root" $ "application" . "fullName" $fullName) | nindent 4 }}
  {{- with .app.volumeClaimTemplates }}
  {{- /* immutable on a live StatefulSet: keep the rendered shape stable (volumeMode defaults to Filesystem) */}}
  volumeClaimTemplates:
    {{- range . }}
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata: {{- pick . "name" "annotations" "labels" | toYaml | nindent 8 }}
      spec: {{- include "universal-template.pvc.spec" (merge (omit . "name") (dict "volumeMode" "Filesystem")) | nindent 8 }}
    {{- end }}
  {{- end }}
{{-   end }}
{{- end }}
