{{- range $application := .Values.applications }}
{{-   with dig "app" "networkPolicy" dict . }}
{{-     $fullName := include "universal-template.fullName" (list $ $application.name) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}
  namespace: {{ $.Release.Namespace }}
  {{- include "universal-template.metadata" (dict "root" $ "fullName" $fullName "labels" $application.app.extraLabels) | nindent 2 }}
spec:
  podSelector:
    matchLabels: {{- include "universal-template.podSelector" (list $ $fullName) | nindent 6 }}
  policyTypes: {{- .policyTypes | default (list "Ingress" "Egress") | toYaml | nindent 4 }}
  {{- with .ingress }}
  ingress: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .egress }}
  egress: {{- toYaml . | nindent 4 }}
  {{- end }}
{{-   end }}
{{- end }}
