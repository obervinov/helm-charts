{{- range .Values.applications }}
{{-   if eq (dig "app" "type" "none" .) "job" }}
{{-     $fullName := include "universal-template.fullName" (dict "root" $ "name" .name) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s" $fullName (now | unixEpoch) | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  {{- include "universal-template.metadata" (dict "root" $ "fullName" $fullName "labels" .app.extraLabels) | nindent 2 }}
spec: {{- include "universal-template.jobSpec" (dict "root" $ "application" . "fullName" $fullName "settings" .app.job "activeDeadlineSeconds" 600) | nindent 2 }}
{{-   end }}
{{- end }}
