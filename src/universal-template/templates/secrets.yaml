{{- range $application := .Values.applications }}
{{-   with .secret }}
{{-     $fullName := include "universal-template.fullName" (list $ $application.name) }}
{{-     $parsed   := fromYaml (.data | default "") }}
{{- /* fromYaml reports a parse error as the single key Error */}}
{{-     if and (eq (len $parsed) 1) (regexMatch "^error (converting|unmarshaling)" ($parsed.Error | default "" | toString)) }}
{{-       fail (printf "applications[%s].secret.data is not a YAML map of key: value pairs: %s" $application.name $parsed.Error) }}
{{-     end }}
{{-     $data     := dict }}
{{-     range $key, $value := $parsed }}
{{-       $_ := set $data $key (toString $value | b64enc) }}
{{-     end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  {{- include "universal-template.metadata" (dict "root" $ "fullName" $fullName "labels" .extraLabels "annotations" .extraAnnotations) | nindent 2 }}
type: Opaque
data: {{- toYaml $data | nindent 2 }}
{{-   end }}
{{- end }}
