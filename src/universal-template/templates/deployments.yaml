{{- range .Values.applications }}
{{-   if eq (dig "app" "type" "none" .) "deployment" }}
{{-     $fullName := include "universal-template.fullName" (list $ .name) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  namespace: {{ $.Release.Namespace }}
  {{- include "universal-template.metadata" (dict "root" $ "fullName" $fullName "labels" .app.extraLabels) | nindent 2 }}
spec:
  replicas: {{ .app.replicas | default 1 }}
  {{- with .app.strategy }}
  strategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{- include "universal-template.selectorLabels" (list $fullName) | nindent 6 }}
  template: {{- include "universal-template.podTemplate" (dict "root" $ "application" . "fullName" $fullName) | nindent 4 }}
{{-   end }}
{{- end }}
