{{- range .Values.applications }}
{{-   if eq (dig "app" "type" "none" .) "cronjob" }}
{{-     $fullName := include "universal-template.fullName" (list $ .name) }}
{{-     $cronJob  := .app.cronJob }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullName | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  {{- include "universal-template.metadata" (dict "root" $ "fullName" $fullName "labels" .app.extraLabels) | nindent 2 }}
spec:
  schedule: {{ $cronJob.schedule | quote }}
  failedJobsHistoryLimit: {{ dig "failedJobsHistoryLimit" 1 $cronJob | toJson }}
  successfulJobsHistoryLimit: {{ dig "successfulJobsHistoryLimit" 1 $cronJob | toJson }}
  concurrencyPolicy: {{ $cronJob.concurrencyPolicy | default "Forbid" | quote }}
  jobTemplate:
    spec:
      parallelism: {{ $cronJob.parallelism | default 1 | toJson }}
      completions: {{ $cronJob.completions | default 1 | toJson }}
      backoffLimit: {{ $cronJob.backoffLimit | default 3 | toJson }}
      activeDeadlineSeconds: {{ $cronJob.activeDeadlineSeconds | default 300 | toJson }}
      ttlSecondsAfterFinished: {{ $cronJob.ttlSecondsAfterFinished | default 300 | toJson }}
      template: {{- include "universal-template.podTemplate" (dict "root" $ "application" . "fullName" $fullName "restartPolicy" ($cronJob.restartPolicy | default "Never")) | nindent 8 }}
{{-   end }}
{{- end }}
