{{- range .Values.applications }}
{{-   $fullName := include "universal-template.fullName" (list $ .name) }}
{{-   range .services }}
{{-     $nodePort := eq .type "NodePort" }}
{{-     $ports    := list }}
{{-     range .ports }}
{{-       $ports = append $ports ($nodePort | ternary . (omit . "nodePort")) }}
{{-     end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "universal-template.service.name" (list $fullName .) }}
  namespace: {{ $.Release.Namespace }}
  {{- include "universal-template.metadata" (dict "root" $ "fullName" $fullName "labels" .extraLabels "annotations" .extraAnnotations) | nindent 2 }}
spec:
  {{- with .type }}
  type: {{ . }}
  {{- end }}
  {{- with .clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  ports: {{- toYaml $ports | nindent 4 }}
  {{- with .externalIPs }}
  externalIPs: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector: {{- include "universal-template.service.selector" (list $ $fullName .) | nindent 4 }}
{{-   end }}
{{- end }}
