{{- range .Values.applications }}
{{-   $fullName := include "universal-template.fullName" (dict "root" $ "name" .name) }}
{{-   range .services }}
{{-     $nodePort := eq .type "NodePort" }}
{{-     $ports    := list }}
{{-     range .ports }}
{{-       $ports = append $ports ($nodePort | ternary . (omit . "nodePort")) }}
{{-     end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "universal-template.service.name" (dict "fullName" $fullName "service" .) | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  {{- include "universal-template.metadata" (dict "root" $ "fullName" $fullName "labels" .extraLabels "annotations" .extraAnnotations) | nindent 2 }}
spec:
  {{- with .type }}
  type: {{ . | quote }}
  {{- end }}
  {{- with .clusterIP }}
  clusterIP: {{ . | quote }}
  {{- end }}
  ports: {{- toYaml $ports | nindent 4 }}
  {{- with .externalIPs }}
  externalIPs: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .externalTrafficPolicy }}
  externalTrafficPolicy: {{ . | quote }}
  {{- end }}
  selector: {{- include "universal-template.service.selector" (dict "root" $ "fullName" $fullName "service" .) | nindent 4 }}
{{-   end }}
{{- end }}
