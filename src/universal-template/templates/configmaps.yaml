{{- range $application := .Values.applications }}
{{-   with .configMap }}
{{-     $fullName := include "universal-template.fullName" (list $ $application.name) }}
{{-     $data     := dict }}
{{-     range .files }}
{{-       if .data }}
{{-         $_ := set $data .name (regexReplaceAll "\n+$" (toString .data) "") }}
{{-       end }}
{{-     end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  {{- include "universal-template.metadata" (dict "root" $ "fullName" $fullName "labels" .extraLabels "annotations" .extraAnnotations) | nindent 2 }}
data: {{- toYaml $data | nindent 2 }}
{{-   end }}
{{- end }}
