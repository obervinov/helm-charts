{{- range $application := .Values.applications }}
{{-   with .ingress }}
{{-     $fullName := include "universal-template.fullName" (dict "root" $ "name" $application.name) }}
{{-     $default  := include "universal-template.ingress.defaultService" (dict "root" $ "application" $application) }}
{{-     $paths := list }}
{{-     range .paths }}
{{-       $port := empty .servicePortName | ternary (dict "number" .servicePort) (dict "name" .servicePortName) }}
{{-       $backend := dict "service" (dict "name" (.serviceName | default $default) "port" $port) }}
{{-       $paths = append $paths (dict "path" .path "pathType" .pathType "backend" $backend) }}
{{-     end }}
{{-     $spec := dict "rules" (list (dict "host" .fqdn "http" (dict "paths" $paths))) "ingressClassName" (.ingressClassName | default "nginx") }}
{{-     if .useTLS }}
{{-       $_ := set $spec "tls" (list (dict "hosts" (list .fqdn) "secretName" (printf "%s-tls" $fullName))) }}
{{-     end }}
---
apiVersion: {{ .apiVersion | default "networking.k8s.io/v1" | quote }}
kind: {{ .kind | default "Ingress" | quote }}
metadata:
  name: {{ $fullName | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  {{- include "universal-template.metadata" (dict "root" $ "fullName" $fullName "annotations" .extraAnnotations) | nindent 2 }}
spec: {{- toYaml $spec | nindent 2 }}
{{-   end }}
{{- end }}
