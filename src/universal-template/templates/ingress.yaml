{{- range $application := .Values.applications }}
{{-   with .ingress }}
{{-     $fullName := include "universal-template.fullName" (list $ $application.name) }}
{{-     $default  := "" }}
{{-     with $application.services }}
{{-       $default = include "universal-template.service.name" (list $fullName (first .)) }}
{{-     end }}
---
apiVersion: {{ .apiVersion | default "networking.k8s.io/v1" }}
kind: {{ .kind | default "Ingress" }}
metadata:
  name: {{ $fullName }}
  namespace: {{ $.Release.Namespace }}
  {{- include "universal-template.metadata" (dict "root" $ "fullName" $fullName "annotations" .extraAnnotations) | nindent 2 }}
spec:
  {{- if .useTLS }}
  tls:
    - hosts:
        - {{ .fqdn }}
      secretName: {{ $fullName }}-tls
  {{- end }}
  rules:
  - host: {{ .fqdn }}
    http:
      paths:
      {{- range .paths }}
      - path: {{ .path }}
        pathType: {{ .pathType }}
        backend:
          service:
            name: {{ .serviceName | default $default }}
            port:
              {{- with .servicePortName }}
              name: {{ . }}
              {{- else }}
              number: {{ .servicePort }}
              {{- end }}
      {{- end }}
  ingressClassName: {{ .ingressClassName | default "nginx" }}
{{-   end }}
{{- end }}
