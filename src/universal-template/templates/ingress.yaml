{{- if .Values.applications -}}
{{-   $serviceNames := include "universal-template.service.allNames" $ | fromJsonArray }}
{{-   range $application := .Values.applications -}}
{{-     if $application.ingress -}}
{{-       $name             := $application.name }}
{{-       $fullName         := include "universal-template.fullName" (list $ $application $name) }}
{{-       $namespace        := $.Release.Namespace }}
{{-       $apiVersion       := $application.ingress.apiVersion }}
{{-       $kind             := $application.ingress.kind }}
{{-       $extraAnnotations := $application.ingress.extraAnnotations }}
{{-       $useTLS           := $application.ingress.useTLS }}
{{-       $fqdn             := $application.ingress.fqdn }}
{{-       $paths            := $application.ingress.paths }}
{{-       $ingressClassName := $application.ingress.ingressClassName }}
{{-       $defaultService   := "" }}
{{-       if $application.services }}
{{-         $defaultService = include "universal-template.service.name" (list $fullName $name (first $application.services) 0) }}
{{-       end }}
---
apiVersion: {{ default "networking.k8s.io/v1" $apiVersion }}
kind: {{ default "Ingress" $kind }}
metadata:
  name: {{ $fullName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "universal-template.labels" $ | nindent 4 }}
    {{- include "universal-template.selectorLabels" (list $fullName) | nindent 4 }}
  {{- if $extraAnnotations }}
  annotations:
  {{-   toYaml $extraAnnotations | nindent 4 }}
  {{- end }}
spec:
  {{- if $useTLS }}
  tls:
    - hosts:
        - {{ $fqdn }}
      secretName: {{ $fullName }}-tls
  {{- end }}
  rules:
  - host: {{ $fqdn }}
    http:
      paths:
      {{- range $paths }}
      {{-   $backend := default $defaultService .serviceName }}
      {{-   if not $backend }}
      {{-     fail (printf "applications[%s].ingress.paths[%s]: the application has no services, set serviceName" $name .path) }}
      {{-   end }}
      {{-   if not (has $backend $serviceNames) }}
      {{-     fail (printf "applications[%s].ingress.paths[%s]: serviceName %q is not a Service of this release (known: %s)" $name .path $backend (join ", " $serviceNames)) }}
      {{-   end }}
      - path: {{ .path }}
        pathType: {{ .pathType }}
        backend:
          service:
            name: {{ $backend }}
            port:
              {{- if .servicePortName }}
              name: {{ .servicePortName }}
              {{- else }}
              number: {{ .servicePort }}
              {{- end }}
      {{- end }}
  ingressClassName: {{ default "nginx" $ingressClassName }}
...
{{-     end -}}
{{-   end }}
{{- end }}
