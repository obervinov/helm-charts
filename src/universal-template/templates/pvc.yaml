{{- range .Values.applications }}
{{-   $fullName := include "universal-template.fullName" (dict "root" $ "name" .name) }}
{{-   range .persistentVolumeClaims }}
{{-     $annotations := deepCopy (.annotations | default dict) }}
{{-     if dig "keep" true . }}
{{-       $_ := set $annotations "helm.sh/resource-policy" "keep" }}
{{-     end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "universal-template.pvc.name" (dict "fullName" $fullName "claim" .) | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  {{- include "universal-template.metadata" (dict "root" $ "fullName" $fullName "labels" .labels "annotations" $annotations) | nindent 2 }}
spec: {{- include "universal-template.pvc.spec" . | nindent 2 }}
{{-   end }}
{{- end }}
