{{- range $application := .Values.applications }}
{{-   with .rbac }}
{{-     $fullName := include "universal-template.fullName" (dict "root" $ "name" $application.name) }}
{{-     $metadata := include "universal-template.metadata" (dict "root" $ "fullName" $fullName "labels" .extraLabels "annotations" .extraAnnotations) }}
{{-     if .create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullName | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  {{- $metadata | nindent 2 }}
{{-       if .legacyToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-token" $fullName | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  {{- include "universal-template.metadata" (dict "root" $ "fullName" $fullName "labels" .extraLabels "annotations" (merge (dict "kubernetes.io/service-account.name" $fullName) (.extraAnnotations | default dict))) | nindent 2 }}
type: kubernetes.io/service-account-token
{{-       end }}
{{-       with .rules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  {{- $metadata | nindent 2 }}
rules: {{- toYaml . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  {{- $metadata | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: {{ $fullName | quote }}
    namespace: {{ $.Release.Namespace | quote }}
roleRef:
  kind: Role
  name: {{ $fullName | quote }}
  apiGroup: rbac.authorization.k8s.io
{{-       end }}
{{-     end }}
{{-   end }}
{{- end }}
